name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure test Git identity
        run: |
          git config --global user.name 'Grounds CI'
          git config --global user.email 'ci@example.invalid'
          git config --global init.defaultBranch main
      - run: npm ci --registry=https://registry.npmjs.org
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
      - run: npm test
        env:
          GROUNDS_CI_ISOLATE_PROCESS_SCOPE: ${{ runner.os == 'macOS' }}
        working-directory: typescript
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-docs.mjs
      - name: Validate packaged CLI and skills
        run: node scripts/package-test.mjs
        working-directory: typescript
      - name: Install release tarballs as a user
        run: node scripts/release-artifacts.mjs
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ matrix.os }}-node-${{ matrix.node }}
          path: typescript/test-worker-*.log
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: macos-15, target: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: typescript
      - run: node scripts/release-artifacts.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.target }}
          path: typescript/prebuilds/${{ matrix.target }}/peercred.node
          if-no-files-found: error

  assembled:
    name: Install assembled four-platform package
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --registry=https://registry.npmjs.org && npm run build
        working-directory: typescript
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: native-artifacts
      - name: Assemble the four verified Node-API binaries
        run: |
          for platform in darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            mkdir -p "typescript/prebuilds/$platform"
            cp "native-artifacts/native-$platform/peercred.node" "typescript/prebuilds/$platform/peercred.node"
          done
      - run: node scripts/release-artifacts.mjs --all-platforms
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tested-package
          path: output/release/*
          if-no-files-found: error

  integration:
    name: Integration (MySQL, PostgreSQL, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure test Git identity
        run: |
          git config --global user.name 'Grounds CI'
          git config --global user.email 'ci@example.invalid'
          git config --global init.defaultBranch main
      - run: npm ci --registry=https://registry.npmjs.org && npm run build
        working-directory: typescript
      - name: Run TLS database conformance on all stores
        run: node scripts/test-runtime-postgres.mjs node scripts/test-runtime-mysql.mjs node --import tsx --test --test-concurrency=1 test/postgres-conformance.test.ts test/work-code-delivery.test.ts test/work-storage.test.ts test/work-task-definitions.test.ts test/work-task-execution.test.ts test/work-grading-usecases.test.ts
        working-directory: typescript
      - name: Verify managed work, test graders and batch comparisons with fixture agents
        working-directory: typescript
        run: node scripts/test-managed-worker.mjs
      - name: Verify independent devcontainers and recover interrupted TaskRun preparation
        working-directory: typescript
        run: |
          docker pull alpine:3.22
          export GROUNDS_TEST_CONTAINER_IMAGE=alpine:3.22
          export GROUNDS_TEST_DEVCONTAINER="$PWD/node_modules/.bin/devcontainer"
          export GROUNDS_DATA_HOME="$RUNNER_TEMP/grounds-sandbox-data"
          node --import tsx --test --test-concurrency=1 --test-name-pattern 'three devcontainers|three ledger-backed|killing the preparing CLI|verified local image' test/work-devcontainer-docker.test.ts test/work-cli.test.ts
